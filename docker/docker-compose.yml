services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ederi
      POSTGRES_USER: ederi
      POSTGRES_PASSWORD: ederi
    volumes:
      - ederi_postgres_data:/var/lib/postgresql/data
    ports:
      # Host port 5433 (not 5432) so this doesn't collide with a Postgres
      # instance already installed on the host machine.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ederi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ../.env
    environment:
      # Inside the compose network, services reach each other by name, not
      # via the host-mapped ports above — override whatever .env has.
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://ederi:ederi@db:5432/ederi
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    command: celery -A config worker --loglevel=info
    env_file:
      - ../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://ederi:ederi@db:5432/ederi
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ederi_postgres_data:
